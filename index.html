<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Invitación Tetris Gamer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Press Start 2P (Fuente Pixel) -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #202028;
            --screen-bg: #1a1a1a; /* Fondo más claro para distinguir del juego */
            --tetris-cyan: #00f0f0;
            --tetris-blue: #0000f0;
            --tetris-orange: #f0a000;
            --tetris-yellow: #f0f000;
            --tetris-green: #00f000;
            --tetris-purple: #a000f0;
            --tetris-red: #f00000;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--bg-color);
            color: white;
            overflow: hidden; /* Previene scroll en móvil mientras se juega */
            touch-action: none; /* Deshabilita zoom táctil */
            /* Usar 100dvh asegura que ocupe el alto real visible en móviles (descontando barras del navegador) */
            height: 100dvh; 
            width: 100vw;
        }

        /* Efecto de pantalla CRT antigua */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .game-border {
            border: 4px solid #4a4a4a;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background-color: #9ead86; /* Color clásico GameBoy apagado */
        }

        .screen-container {
            background-color: var(--screen-bg);
            border: 2px solid #333;
            box-shadow: inset 0 0 10px #000;
        }

        /* Botones de control móvil */
        .d-pad-btn {
            background: #333;
            border: 2px solid #555;
            box-shadow: 0 4px 0 #111;
            border-radius: 8px; /* Un poco más cuadrados estilo NES/Gameboy */
            transition: transform 0.1s, background-color 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .d-pad-btn:active, .d-pad-btn.active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #111;
            background: #444;
        }

        .action-btn {
            background: #f00000;
            border: 2px solid #800000;
            box-shadow: 0 4px 0 #500000;
            border-radius: 50%;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .action-btn:active, .action-btn.active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #500000;
            background: #ff2222;
        }

        /* Modal de Invitación */
        #inviteModal {
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Animación de entrada del modal */
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center relative bg-gray-900">

    <!-- Fondo decorativo (bloques cayendo css) -->
    <div class="absolute inset-0 opacity-10 z-0 pointer-events-none overflow-hidden" id="bg-decoration">
        <!-- Generado por JS -->
    </div>

    <!-- Contenedor Principal (Estilo Consola) -->
    <!-- Usamos h-full y flex layout para distribuir el espacio verticalmente -->
    <div class="z-10 w-full max-w-md h-full flex flex-col p-2 md:p-4 justify-between">
        
        <!-- Header: Se oculta en pantallas muy muy pequeñas (landscape) -->
        <header class="text-center mb-1 shrink-0">
            <h1 class="text-yellow-400 text-base md:text-xl drop-shadow-md tracking-widest">TETRIS PARTY</h1>
            <p class="text-[10px] text-gray-400 mt-1">PLAYER 1: <span class="text-white">INVITADO</span></p>
        </header>

        <!-- Pantalla de Juego: Ocupa el espacio disponible -->
        <div class="game-border p-2 md:p-3 flex-grow flex flex-col relative crt min-h-0">
            <!-- Agregamos flex center para centrar el canvas si sobra espacio -->
            <div class="screen-container w-full h-full relative overflow-hidden rounded flex items-center justify-center">
                
                <!-- Canvas del Juego -->
                <!-- Eliminamos w-full h-full y object-contain para controlar tamaño exacto con JS -->
                <!-- Añadimos borde explícito y sombra para delimitar el área de juego -->
                <canvas id="tetris" class="block bg-black border-2 border-gray-700 shadow-[0_0_10px_rgba(0,0,0,0.5)] mx-auto"></canvas>
                
                <!-- UI sobre el canvas: Score -->
                <div class="absolute top-2 left-2 text-white text-[10px] space-y-1 opacity-80 pointer-events-none z-10">
                    <div class="bg-black/50 px-1 rounded">SCORE:<span id="score">0</span></div>
                    <div class="bg-black/50 px-1 rounded">LINES:<span id="lines">0</span></div>
                </div>

                <!-- Botón Overlay: Ver Invitación (Siempre visible) -->
                <button onclick="showInvite()" class="absolute top-2 right-2 bg-yellow-500 hover:bg-yellow-400 text-black text-[8px] py-2 px-3 border-b-2 border-yellow-700 rounded animate-pulse z-30 font-bold shadow-lg">
                    VER INFO
                </button>

                <!-- Pantalla de Inicio (Overlay) -->
                <div id="startScreen" class="absolute inset-0 bg-black/95 flex flex-col items-center justify-center z-20 p-4 text-center">
                    <h2 class="text-3xl md:text-4xl text-transparent bg-clip-text bg-gradient-to-b from-blue-400 to-purple-600 mb-4 font-bold">TETRIS</h2>
                    <p class="text-xs text-center text-gray-300 mb-8 max-w-[250px] leading-5">¡Es mi cumpleaños!<br>Usa los controles abajo para jugar.</p>
                    <button onclick="startGame()" class="blink text-yellow-400 text-sm border-2 border-yellow-400 px-6 py-3 rounded hover:bg-yellow-400 hover:text-black transition uppercase font-bold">
                        Press Start
                    </button>
                </div>
            </div>
        </div>

        <!-- Controles Táctiles (Estilo Gameboy) -->
        <!-- shrink-0 asegura que los controles nunca se aplasten -->
        <div class="mt-2 pb-2 select-none shrink-0 w-full max-w-[350px] mx-auto">
            <div class="flex justify-between items-end px-2">
                <!-- D-PAD -->
                <div class="grid grid-cols-3 gap-2 w-36 h-36">
                    <div></div>
                    <button class="d-pad-btn w-full h-full flex items-center justify-center text-gray-400 text-xl" id="btn-up" aria-label="Rotar">▲</button>
                    <div></div>
                    <button class="d-pad-btn w-full h-full flex items-center justify-center text-gray-400 text-xl" id="btn-left" aria-label="Izquierda">◀</button>
                    <div class="bg-gray-800 rounded-full w-4 h-4 m-auto"></div> <!-- Centro decorativo -->
                    <button class="d-pad-btn w-full h-full flex items-center justify-center text-gray-400 text-xl" id="btn-right" aria-label="Derecha">▶</button>
                    <div></div>
                    <button class="d-pad-btn w-full h-full flex items-center justify-center text-gray-400 text-xl" id="btn-down" aria-label="Abajo">▼</button>
                    <div></div>
                </div>

                <!-- Botones Acción -->
                <div class="flex flex-col items-center justify-center h-36 pb-4 pl-4">
                     <button class="action-btn w-20 h-20 text-sm font-bold text-red-900 flex items-center justify-center shadow-lg" id="btn-action" onclick="playerRotate(1)">
                        A
                     </button>
                     <span class="text-[10px] text-gray-500 mt-2 font-bold tracking-wider">ROTAR</span>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE INVITACIÓN (Escondido por defecto) -->
    <div id="inviteModal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
        <div class="bg-gray-900 border-4 border-purple-500 p-6 rounded-lg shadow-2xl max-w-sm w-full text-center relative pop-in overflow-y-auto max-h-[90vh]">
            <!-- Confeti Canvas dentro del modal -->
            <canvas id="confetti" class="absolute inset-0 pointer-events-none w-full h-full fixed"></canvas>

            <button onclick="closeInvite()" class="absolute top-2 right-2 text-gray-500 hover:text-white p-2 text-lg">✕</button>
            
            <h2 class="text-green-400 text-xl mb-2 mt-2">LEVEL UP!</h2>
            <h3 class="text-white text-xs mb-6 uppercase tracking-wider">Misión: Celebrar mi Cumpleaños</h3>

            <!-- DATOS DE LA INVITACIÓN -->
            <div class="space-y-4 text-xs leading-6 border-2 border-gray-700 p-4 bg-black/50 rounded mb-4">
                <div>
                    <span class="text-cyan-400 block mb-1">PLAYER:</span>
                    <span class="text-white text-sm">ALEJANDRO (30 AÑOS)</span>
                </div>
                
                <div>
                    <span class="text-yellow-400 block mb-1">FECHA:</span>
                    <span class="text-white">Sábado, 24 de Octubre</span>
                </div>

                <div>
                    <span class="text-purple-400 block mb-1">HORA:</span>
                    <span class="text-white">20:00 HRS</span>
                </div>

                <div>
                    <span class="text-red-400 block mb-1">BASE:</span>
                    <span class="text-white">Av. Principal 123, <br>Bar Arcade</span>
                </div>
            </div>

            <div class="flex flex-col gap-3 relative z-10">
                <a href="https://wa.me/?text=Confirmo%20asistencia%20al%20cumple" target="_blank" class="bg-green-600 hover:bg-green-500 text-white py-4 rounded shadow-[0_4px_0_rgb(20,83,45)] active:shadow-none active:translate-y-1 transition text-xs font-bold tracking-widest">
                    CONFIRMAR (WHATSAPP)
                </a>
                <button onclick="closeInvite()" class="text-gray-400 text-[10px] hover:text-white underline py-2">
                    VOLVER AL JUEGO
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- LÓGICA DEL JUEGO TETRIS ---
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');

        // Piezas del Tetris
        const pieces = 'ILJOTSZ';
        const colors = [
            null,
            '#FF0D72', // T - Magenta
            '#0DC2FF', // I - Cyan
            '#0DFF72', // S - Green
            '#F538FF', // Z - Purple-ish (Custom)
            '#FF8E0D', // L - Orange
            '#FFE138', // O - Yellow
            '#3877FF', // J - Blue
        ];

        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [0, 2, 2],
                ];
            } else if (type === 'J') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [3, 3, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'Z') {
                return [
                    [5, 5, 0],
                    [0, 5, 5],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 7, 0],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        // Crear la matriz del tablero
        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        // Detectar colisiones
        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // Dibujar el juego
        function draw() {
            // Fondo negro limpio
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        // Bloque principal
                        context.fillStyle = colors[value];
                        // Un margen más grande (0.1) para que se vea bien en pantallas pequeñas
                        context.fillRect(x + offset.x + 0.05, y + offset.y + 0.05, 0.9, 0.9);
                        
                        // Brillo (simulado 3d simple)
                        context.fillStyle = 'rgba(255,255,255,0.5)';
                        context.fillRect(x + offset.x + 0.1, y + offset.y + 0.1, 0.2, 0.2);
                    }
                });
            });
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerMove(offset) {
            player.pos.x += offset;
            if (collide(arena, player)) {
                player.pos.x -= offset;
            }
        }

        function playerReset() {
            const piecesStr = 'ILJOTSZ';
            player.matrix = createPiece(piecesStr[piecesStr.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            
            // Game Over
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                player.lines = 0;
                updateScore();
                // Mostrar invitación automáticamente al perder
                setTimeout(showInvite, 200);
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isPaused = true;

        function update(time = 0) {
            if (isPaused) return;

            if (!lastTime) lastTime = time;
            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('lines').innerText = player.lines;
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length -1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 10;
                player.lines += 1;
                rowCount *= 2;
            }
        }

        // Configuración inicial
        const arena = createMatrix(12, 20); // 12 ancho para que sea fácil en móvil
        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            lines: 0,
        };

        // --- SISTEMA DE CONTROL MEJORADO PARA MÓVIL ---
        
        // Teclado (Desktop fallback)
        document.addEventListener('keydown', event => {
            if (isPaused) return;
            if (event.keyCode === 37) {
                playerMove(-1);
            } else if (event.keyCode === 39) {
                playerMove(1);
            } else if (event.keyCode === 40) {
                playerDrop();
            } else if (event.keyCode === 81 || event.keyCode === 38) {
                playerRotate(1);
            } else if (event.keyCode === 87) {
                playerRotate(-1);
            }
        });

        // Controles Táctiles con REPETICIÓN (Hold to move)
        // Esto hace que el juego se sienta fluido en el móvil
        function addTouchControl(id, action, isContinuous = true) {
            const btn = document.getElementById(id);
            if(!btn) return;
            
            let intervalId = null;
            let timeoutId = null;
            
            const startAction = (e) => {
                if(e.cancelable) e.preventDefault(); // Evita scroll
                if(isPaused) return;
                
                // Animación visual botón
                btn.classList.add('active');

                action(); // Ejecutar 1 vez inmediatamente
                
                if (isContinuous) {
                    // Esperar un poco y luego repetir rápido
                    timeoutId = setTimeout(() => {
                        intervalId = setInterval(action, 100); // Repetir cada 100ms
                    }, 200); // Esperar 200ms antes de repetir
                }
            };
            
            const stopAction = (e) => {
                if(e && e.cancelable) e.preventDefault();
                btn.classList.remove('active');
                clearTimeout(timeoutId);
                clearInterval(intervalId);
            };

            // Touch events
            btn.addEventListener('touchstart', startAction, {passive: false});
            btn.addEventListener('touchend', stopAction);
            btn.addEventListener('touchcancel', stopAction);
            
            // Mouse events (para probar en PC simulando touch)
            btn.addEventListener('mousedown', startAction);
            btn.addEventListener('mouseup', stopAction);
            btn.addEventListener('mouseleave', stopAction);
        }

        // Configurar botones
        addTouchControl('btn-left', () => playerMove(-1), true);
        addTouchControl('btn-right', () => playerMove(1), true);
        addTouchControl('btn-down', () => playerDrop(), true); // Bajar rápido si mantienes
        addTouchControl('btn-up', () => playerRotate(1), false); // Rotar no debe ser continuo
        addTouchControl('btn-action', () => playerRotate(1), false);


        // --- UI LOGIC ---

        function resizeCanvas() {
            // Lógica ajustada para mantener aspect ratio sin deformar
            // y llenar el espacio disponible
            const container = document.querySelector('.screen-container');
            const aspect = 240 / 400; // Aspect ratio del juego original
            const contW = container.clientWidth;
            const contH = container.clientHeight;

            let finalW, finalH;

            // Calcular dimensiones máximas manteniendo proporción
            if (contW / contH < aspect) {
                // Limitado por ancho
                finalW = contW;
                finalH = contW / aspect;
            } else {
                // Limitado por alto
                finalH = contH;
                finalW = contH * aspect;
            }

            // Fijar resolución interna (lógica del juego)
            canvas.width = 240; 
            canvas.height = 400;

            // Fijar tamaño visual (estilos CSS)
            // Esto evita que se use el w-full del CSS y se deforme
            canvas.style.width = `${finalW}px`;
            canvas.style.height = `${finalH}px`;
            
            // Escalar contexto para dibujar bloques grandes
            context.scale(20, 20); 
            
            if (!isPaused && player.matrix) {
                draw();
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();


        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            playerReset();
            updateScore();
            isPaused = false;
            lastTime = 0;
            requestAnimationFrame(update);
        }

        function showInvite() {
            isPaused = true;
            document.getElementById('inviteModal').style.display = 'flex';
            startConfetti();
        }

        function closeInvite() {
            document.getElementById('inviteModal').style.display = 'none';
            stopConfetti();
            isPaused = false;
            lastTime = 0;
            requestAnimationFrame(update);
        }

        // Decoración de fondo
        function createFallingBlocks() {
            const bg = document.getElementById('bg-decoration');
            const colors = ['#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
            
            for(let i = 0; i < 15; i++) {
                const el = document.createElement('div');
                const size = Math.random() * 20 + 10;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.position = 'absolute';
                el.style.left = Math.random() * 100 + '%';
                el.style.top = -50 + 'px';
                el.style.opacity = Math.random() * 0.5 + 0.1;
                el.style.animation = `fall ${Math.random() * 10 + 5}s linear infinite`;
                el.style.animationDelay = Math.random() * 5 + 's';
                bg.appendChild(el);
            }

            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes fall {
                    to { transform: translateY(110vh) rotate(360deg); }
                }
            `;
            document.head.appendChild(style);
        }
        createFallingBlocks();


        // --- CONFETTI SYSTEM ---
        const confettiCanvas = document.getElementById('confetti');
        const ctxConfetti = confettiCanvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimationId;

        function startConfetti() {
            confettiCanvas.width = confettiCanvas.offsetWidth;
            confettiCanvas.height = confettiCanvas.offsetHeight;
            confettiParticles = [];
            
            for (let i = 0; i < 100; i++) {
                confettiParticles.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * confettiCanvas.height - confettiCanvas.height,
                    color: colors[Math.floor(Math.random() * colors.length) || 1],
                    size: Math.random() * 5 + 2,
                    speed: Math.random() * 3 + 1,
                    angle: Math.random() * 360
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctxConfetti.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            
            confettiParticles.forEach(p => {
                p.y += p.speed;
                p.angle += 2;
                if (p.y > confettiCanvas.height) {
                    p.y = -10;
                    p.x = Math.random() * confettiCanvas.width;
                }
                
                ctxConfetti.save();
                ctxConfetti.translate(p.x, p.y);
                ctxConfetti.rotate(p.angle * Math.PI / 180);
                ctxConfetti.fillStyle = p.color;
                ctxConfetti.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctxConfetti.restore();
            });

            confettiAnimationId = requestAnimationFrame(animateConfetti);
        }

        function stopConfetti() {
            cancelAnimationFrame(confettiAnimationId);
            ctxConfetti.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }

    </script>
</body>
