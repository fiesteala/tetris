<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Invitación Tetris Gamer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Press Start 2P (Fuente Pixel) -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #202028;
            --screen-bg: #000;
            --tetris-cyan: #00f0f0;
            --tetris-blue: #0000f0;
            --tetris-orange: #f0a000;
            --tetris-yellow: #f0f000;
            --tetris-green: #00f000;
            --tetris-purple: #a000f0;
            --tetris-red: #f00000;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--bg-color);
            color: white;
            overflow: hidden; /* Previene scroll en móvil mientras se juega */
            touch-action: none; /* Deshabilita zoom táctil */
        }

        /* Efecto de pantalla CRT antigua */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .game-border {
            border: 4px solid #4a4a4a;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background-color: #9ead86; /* Color clásico GameBoy apagado */
        }

        .screen-container {
            background-color: var(--screen-bg);
            border: 2px solid #333;
            box-shadow: inset 0 0 10px #000;
        }

        /* Botones de control móvil */
        .d-pad-btn {
            background: #333;
            border: 2px solid #555;
            box-shadow: 0 4px 0 #111;
            active:translate-y(2px);
            border-radius: 50%;
            transition: transform 0.1s;
        }
        .d-pad-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #111;
        }

        .action-btn {
            background: #f00000;
            border: 2px solid #800000;
            box-shadow: 0 4px 0 #500000;
            border-radius: 50%;
        }
        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #500000;
        }

        /* Modal de Invitación */
        #inviteModal {
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Animación de entrada del modal */
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- Fondo decorativo (bloques cayendo css) -->
    <div class="absolute inset-0 opacity-10 z-0 pointer-events-none overflow-hidden" id="bg-decoration">
        <!-- Generado por JS -->
    </div>

    <!-- Contenedor Principal (Estilo Consola) -->
    <div class="z-10 w-full max-w-md h-full max-h-[900px] flex flex-col p-4">
        
        <!-- Header -->
        <header class="text-center mb-2">
            <h1 class="text-yellow-400 text-lg md:text-xl drop-shadow-md tracking-widest">TETRIS PARTY</h1>
            <p class="text-xs text-gray-400 mt-1">PLAYER 1: <span class="text-white">INVITADO</span></p>
        </header>

        <!-- Pantalla de Juego -->
        <div class="game-border p-3 flex-grow flex flex-col relative crt">
            <div class="screen-container flex-grow relative overflow-hidden rounded">
                <!-- Canvas del Juego -->
                <canvas id="tetris" class="block w-full h-full object-contain mx-auto bg-black"></canvas>
                
                <!-- UI sobre el canvas: Score -->
                <div class="absolute top-2 left-2 text-white text-[10px] space-y-1 opacity-80">
                    <div>SCORE:<span id="score">0</span></div>
                    <div>LINES:<span id="lines">0</span></div>
                </div>

                <!-- Botón Overlay: Ver Invitación (Siempre visible) -->
                <button onclick="showInvite()" class="absolute top-2 right-2 bg-yellow-500 hover:bg-yellow-400 text-black text-[8px] py-1 px-2 border-b-2 border-yellow-700 rounded animate-pulse">
                    VER INFO
                </button>

                <!-- Pantalla de Inicio (Overlay) -->
                <div id="startScreen" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-20">
                    <h2 class="text-4xl text-transparent bg-clip-text bg-gradient-to-b from-blue-400 to-purple-600 mb-4 font-bold">TETRIS</h2>
                    <p class="text-xs text-center text-gray-300 mb-8 max-w-[200px] leading-5">¡Es mi cumpleaños y quiero jugar contigo!</p>
                    <button onclick="startGame()" class="blink text-yellow-400 text-sm border-2 border-yellow-400 px-4 py-2 rounded hover:bg-yellow-400 hover:text-black transition">
                        PRESS START
                    </button>
                </div>
            </div>
        </div>

        <!-- Controles Táctiles (Estilo Gameboy) -->
        <div class="mt-4 pb-2 select-none">
            <div class="flex justify-between items-end px-4">
                <!-- D-PAD -->
                <div class="grid grid-cols-3 gap-1 w-32 h-32">
                    <div></div>
                    <button class="d-pad-btn w-full h-full flex items-center justify-center text-gray-400" id="btn-up" aria-label="Rotar">▲</button>
                    <div></div>
                    <button class="d-pad-btn w-full h-full flex items-center justify-center text-gray-400" id="btn-left" aria-label="Izquierda">◀</button>
                    <div class="bg-gray-800 rounded-full w-4 h-4 m-auto"></div> <!-- Centro decorativo -->
                    <button class="d-pad-btn w-full h-full flex items-center justify-center text-gray-400" id="btn-right" aria-label="Derecha">▶</button>
                    <div></div>
                    <button class="d-pad-btn w-full h-full flex items-center justify-center text-gray-400" id="btn-down" aria-label="Abajo">▼</button>
                    <div></div>
                </div>

                <!-- Botones Acción -->
                <div class="flex flex-col items-center space-y-4 mb-2">
                    <div class="flex space-x-4">
                        <div class="flex flex-col items-center">
                             <button class="action-btn w-14 h-14 text-xs font-bold text-red-900" onclick="playerRotate(1)">A</button>
                             <span class="text-[10px] text-gray-500 mt-1">ROTAR</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE INVITACIÓN (Escondido por defecto) -->
    <div id="inviteModal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
        <div class="bg-gray-900 border-4 border-purple-500 p-6 rounded-lg shadow-2xl max-w-sm w-full text-center relative pop-in">
            <!-- Confeti Canvas dentro del modal -->
            <canvas id="confetti" class="absolute inset-0 pointer-events-none w-full h-full"></canvas>

            <button onclick="closeInvite()" class="absolute top-2 right-2 text-gray-500 hover:text-white">✕</button>
            
            <h2 class="text-green-400 text-xl mb-2">LEVEL UP!</h2>
            <h3 class="text-white text-sm mb-6">Misión: Celebrar mi Cumpleaños</h3>

            <!-- DATOS DE LA INVITACIÓN -->
            <div class="space-y-4 text-xs leading-6 border-2 border-gray-700 p-4 bg-black/50 rounded">
                <div>
                    <span class="text-cyan-400 block mb-1">PLAYER:</span>
                    <span class="text-white text-sm">ALEJANDRO (30 AÑOS)</span>
                </div>
                
                <div>
                    <span class="text-yellow-400 block mb-1">FECHA:</span>
                    <span class="text-white">Sábado, 24 de Octubre</span>
                </div>

                <div>
                    <span class="text-purple-400 block mb-1">HORA:</span>
                    <span class="text-white">20:00 HRS</span>
                </div>

                <div>
                    <span class="text-red-400 block mb-1">BASE:</span>
                    <span class="text-white">Av. Principal 123, <br>Bar Arcade</span>
                </div>
            </div>

            <div class="mt-6 flex flex-col gap-3">
                <a href="https://wa.me/?text=Confirmo%20asistencia%20al%20cumple" target="_blank" class="bg-green-600 hover:bg-green-500 text-white py-3 rounded shadow-[0_4px_0_rgb(20,83,45)] active:shadow-none active:translate-y-1 transition text-xs">
                    CONFIRMAR (WHATSAPP)
                </a>
                <button onclick="closeInvite()" class="text-gray-400 text-[10px] hover:text-white underline">
                    VOLVER AL JUEGO
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- LÓGICA DEL JUEGO TETRIS ---
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');

        // Escalar elementos visuales 20x para verlos pixelados
        // IMPORTANTE: Esto se mueve a resizeCanvas para evitar bugs al redimensionar

        // Piezas del Tetris
        const pieces = 'ILJOTSZ';
        const colors = [
            null,
            '#FF0D72', // T - Magenta
            '#0DC2FF', // I - Cyan
            '#0DFF72', // S - Green
            '#F538FF', // Z - Purple-ish (Custom)
            '#FF8E0D', // L - Orange
            '#FFE138', // O - Yellow
            '#3877FF', // J - Blue
        ];

        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [0, 2, 2],
                ];
            } else if (type === 'J') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [3, 3, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'Z') {
                return [
                    [5, 5, 0],
                    [0, 5, 5],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 7, 0],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        // Crear la matriz del tablero
        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        // Detectar colisiones
        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // Dibujar el juego
        function draw() {
            // Fondo negro
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        // Borde de bloque
                        context.fillStyle = 'rgba(255,255,255,0.1)';
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        // Bloque interior
                        context.fillStyle = colors[value];
                        // Un pequeño margen para que parezcan bloques separados
                        context.fillRect(x + offset.x + 0.1, y + offset.y + 0.1, 0.8, 0.8);
                    }
                });
            });
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerMove(offset) {
            player.pos.x += offset;
            if (collide(arena, player)) {
                player.pos.x -= offset;
            }
        }

        function playerReset() {
            const piecesStr = 'ILJOTSZ';
            player.matrix = createPiece(piecesStr[piecesStr.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            
            // Game Over
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                player.lines = 0;
                updateScore();
                // Opcional: Mostrar invitación al perder
                setTimeout(showInvite, 500);
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isPaused = true;

        function update(time = 0) {
            if (isPaused) return;

            // Fix para el primer frame: evitar salto grande
            if (!lastTime) lastTime = time;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('lines').innerText = player.lines;
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length -1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 10;
                player.lines += 1;
                rowCount *= 2;
            }
        }

        // Configuración inicial
        const arena = createMatrix(12, 20); // 12 ancho para móviles estrechos
        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            lines: 0,
        };

        // --- SISTEMA DE CONTROL ---
        
        // Teclado
        document.addEventListener('keydown', event => {
            if (isPaused) return;
            if (event.keyCode === 37) {
                playerMove(-1);
            } else if (event.keyCode === 39) {
                playerMove(1);
            } else if (event.keyCode === 40) {
                playerDrop();
            } else if (event.keyCode === 81 || event.keyCode === 38) { // Q or Up
                playerRotate(1);
            } else if (event.keyCode === 87) { // W
                playerRotate(-1);
            }
        });

        // Controles Táctiles (Botones)
        // Función auxiliar para prevenir doble disparo en táctil
        function addTouchControl(id, action) {
            const btn = document.getElementById(id);
            if(!btn) return;
            
            // Usamos touchstart para respuesta rápida en móvil
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault(); // evita scroll o zoom
                if(!isPaused) action();
            }, {passive: false});
            
            // Fallback para click ratón
            btn.addEventListener('mousedown', (e) => {
                if(!isPaused) action();
            });
        }

        addTouchControl('btn-left', () => playerMove(-1));
        addTouchControl('btn-right', () => playerMove(1));
        addTouchControl('btn-down', () => playerDrop());
        addTouchControl('btn-up', () => playerRotate(1));


        // --- UI LOGIC ---

        // Ajustar tamaño del canvas dinámicamente
        function resizeCanvas() {
            const container = document.querySelector('.screen-container');
            // IMPORTANTE: Al cambiar width/height, el contexto se resetea.
            // Siempre debemos re-aplicar el escalado después de ajustar dimensiones.
            canvas.width = 240; 
            canvas.height = 400;
            context.scale(20, 20); // Zoom 20x para ver los bloques
            
            // Si no estamos pausados, redibujar inmediatamente para que no parpadee
            if (!isPaused && player.matrix) {
                draw();
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();


        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            playerReset();
            updateScore();
            isPaused = false;
            lastTime = 0; // Resetear tiempo para evitar drops inmediatos
            requestAnimationFrame(update); // Iniciar loop con timestamp correcto
        }

        function showInvite() {
            isPaused = true;
            document.getElementById('inviteModal').style.display = 'flex';
            startConfetti();
        }

        function closeInvite() {
            document.getElementById('inviteModal').style.display = 'none';
            stopConfetti();
            isPaused = false;
            lastTime = 0; // Reset time delta
            requestAnimationFrame(update);
        }

        // Decoración de fondo
        function createFallingBlocks() {
            const bg = document.getElementById('bg-decoration');
            const shapes = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
            const colors = ['#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
            
            for(let i = 0; i < 15; i++) {
                const el = document.createElement('div');
                const size = Math.random() * 20 + 10;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.position = 'absolute';
                el.style.left = Math.random() * 100 + '%';
                el.style.top = -50 + 'px';
                el.style.opacity = Math.random() * 0.5 + 0.1;
                el.style.animation = `fall ${Math.random() * 10 + 5}s linear infinite`;
                el.style.animationDelay = Math.random() * 5 + 's';
                bg.appendChild(el);
            }

            // Añadir keyframes dinámicamente
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes fall {
                    to { transform: translateY(110vh) rotate(360deg); }
                }
            `;
            document.head.appendChild(style);
        }
        createFallingBlocks();


        // --- CONFETTI SYSTEM (Simple JS) ---
        const confettiCanvas = document.getElementById('confetti');
        const ctxConfetti = confettiCanvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimationId;

        function startConfetti() {
            confettiCanvas.width = confettiCanvas.offsetWidth;
            confettiCanvas.height = confettiCanvas.offsetHeight;
            confettiParticles = [];
            
            for (let i = 0; i < 100; i++) {
                confettiParticles.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * confettiCanvas.height - confettiCanvas.height,
                    color: colors[Math.floor(Math.random() * colors.length) || 1],
                    size: Math.random() * 5 + 2,
                    speed: Math.random() * 3 + 1,
                    angle: Math.random() * 360
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctxConfetti.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            
            confettiParticles.forEach(p => {
                p.y += p.speed;
                p.angle += 2;
                if (p.y > confettiCanvas.height) {
                    p.y = -10;
                    p.x = Math.random() * confettiCanvas.width;
                }
                
                ctxConfetti.save();
                ctxConfetti.translate(p.x, p.y);
                ctxConfetti.rotate(p.angle * Math.PI / 180);
                ctxConfetti.fillStyle = p.color;
                ctxConfetti.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctxConfetti.restore();
            });

            confettiAnimationId = requestAnimationFrame(animateConfetti);
        }

        function stopConfetti() {
            cancelAnimationFrame(confettiAnimationId);
            ctxConfetti.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }

    </script>
</body>
</html>
